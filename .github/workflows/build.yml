name: Build Windows EXE

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name "SkinportCalculatorV3" SkinportCalculatorV3.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CS2-Skin-Calculator
          path: dist/CS2 Skin Calculator.exe
